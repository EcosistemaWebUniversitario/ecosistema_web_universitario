<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – Sistema de Horarios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Partículas y efectos de la cabecera */
        .particle-dot {
            position: absolute;
            width: 1px;
            height: 1px;
            background: rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100%) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100%) translateX(20px); opacity: 0; }
        }
        .tech-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2), transparent);
            animation: scanLine 3s infinite linear;
        }
        @keyframes scanLine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .avatar-ring {
            animation: rotateRing 20s linear infinite;
        }
        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 60px rgba(16,185,129,0.5); }
        }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .notificacion { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal-overlay { display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

<!-- ========== CABECERA DEL ECOSISTEMA (con avatar y selector) ========== -->
<header class="relative bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-900 text-white py-8 px-4 shadow-xl overflow-hidden">
    <!-- Partículas -->
    <div id="headerParticles" class="absolute inset-0 pointer-events-none"></div>
    <!-- Líneas tech -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="tech-line" style="top:20%; width:80%; animation-delay:0s;"></div>
        <div class="tech-line" style="top:60%; width:60%; animation-delay:1.5s;"></div>
        <div class="tech-line" style="top:80%; width:70%; animation-delay:3s;"></div>
    </div>
    <!-- Glow central -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl"></div>

    <div class="relative z-10 max-w-4xl mx-auto text-center">
        <!-- Avatar -->
        <div class="relative inline-block mb-5">
            <div class="avatar-ring absolute -inset-2 rounded-full border-2 border-emerald-400/30"></div>
            <div class="w-28 h-28 mx-auto rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-4xl text-white shadow-lg animate-[avatarGlow_3s_ease-in-out_infinite] border-2 border-white/20">
                <i class="fas fa-user-astronaut"></i>
            </div>
        </div>

        <!-- Nombre y rol -->
        <h1 id="userName" class="text-2xl font-black tracking-tight text-white mb-1">Estudiante</h1>
        <p id="userRole" class="text-sm font-semibold uppercase tracking-[0.25em] text-emerald-300 mb-6">Estudiante</p>

        <!-- Selector de horario -->
        <div class="inline-block w-full max-w-md bg-white/10 backdrop-blur rounded-2xl p-5 border border-white/10 text-left">
            <label for="selectorHorario" class="block text-xs font-semibold uppercase tracking-[0.2em] text-emerald-300 mb-3">
                <i class="fas fa-calendar-alt mr-1"></i> Seleccionar Horario
            </label>
            <select id="selectorHorario" class="w-full rounded-xl bg-white/10 border border-white/20 text-white px-4 py-2.5 text-sm font-medium focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 [&>option]:bg-slate-900 [&>option]:text-white">
                <option value="">Cargando horarios...</option>
            </select>
            <p class="text-xs text-white/50 mt-2 flex items-center gap-1">
                <i class="fas fa-info-circle"></i> Selecciona año y semestre para ver tu horario
            </p>
        </div>
    </div>
</header>

<!-- ========== BARRA DE NAVEGACIÓN ========== -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
        <div class="flex items-center gap-1 overflow-x-auto">
            <button onclick="mostrarCalendario()" id="tab-calendario" class="px-4 py-3 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-700 whitespace-nowrap transition">
                <i class="fas fa-calendar-day mr-1"></i> Esta Semana
            </button>
            <button onclick="mostrarAsignaturas()" id="tab-asignaturas" class="px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition">
                <i class="fas fa-book-open mr-1"></i> Asignaturas
            </button>
            <a href="/horarios/user/horario-semestral-completo" id="linkHorarioCompleto"
               class="px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition inline-block">
                <i class="fas fa-calendar-alt mr-1"></i> Horario Semestral
            </a>
        </div>
        <button onclick="logout()" class="text-sm font-semibold text-red-500 hover:text-red-700 transition px-3 py-2 rounded-xl hover:bg-red-50">
            <i class="fas fa-sign-out-alt mr-1"></i> Salir
        </button>
    </div>
</nav>

<!-- ========== CONTENIDO PRINCIPAL ========== -->
<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Panel: Esta Semana -->
    <div id="panel-calendario">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
            <!-- Cabecera de semana -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 p-5 border-b border-slate-100">
                <div>
                    <h2 class="text-xl font-black text-slate-900">
                        <i class="fas fa-calendar-alt text-emerald-600 mr-2"></i>Semana Actual
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">
                        Mostrando semana <span id="semanaMostrada" class="font-bold text-slate-700">1</span>
                        <span id="infoHorarioActual" class="ml-2 bg-slate-100 text-slate-600 rounded-full px-3 py-0.5 text-xs font-medium">Cargando...</span>
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="cambiarSemana(-1)" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button onclick="irASemanaActual()" class="rounded-xl bg-slate-950 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 transition">
                        Hoy
                    </button>
                    <button onclick="cambiarSemana(1)" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <!-- Grid del calendario -->
            <div id="calendarioSemanal" class="p-5">
                <div class="text-center py-10 text-slate-400">
                    <i class="fas fa-spinner fa-pulse text-3xl mb-3"></i>
                    <p>Cargando semana...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel: Asignaturas -->
    <div id="panel-asignaturas" class="hidden">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-100">
                <h2 class="text-xl font-black text-slate-900">
                    <i class="fas fa-book text-emerald-600 mr-2"></i>Mis Asignaturas
                </h2>
                <span id="contadorAsignaturas" class="bg-slate-100 text-slate-600 rounded-full px-3 py-1 text-xs font-semibold">0</span>
            </div>
            <div id="listaAsignaturas" class="p-5">
                <div class="text-center py-10 text-slate-400">
                    <i class="fas fa-spinner fa-pulse text-3xl mb-3"></i>
                    <p>Cargando asignaturas...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ========== MODAL DETALLE CLASE ========== -->
<div id="modalDetalleOverlay" class="fixed inset-0 z-50 modal-overlay bg-black/40 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 overflow-hidden ring-1 ring-slate-200">
        <div class="flex items-center justify-between p-5 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-900">Detalles de la Clase</h2>
            <button onclick="cerrarModalDetalle()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
        </div>
        <div id="detalleClaseContenido" class="p-5 text-sm text-slate-600"></div>
        <div class="flex justify-end p-5 bg-slate-50 border-t border-slate-200">
            <button onclick="cerrarModalDetalle()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition">Cerrar</button>
        </div>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════
    // AUTENTICACIÓN
    // ═══════════════════════════════════════════
    function getToken() {
        return localStorage.getItem('token') ?? localStorage.getItem('access_token') ?? localStorage.getItem('authToken');
    }
    function requireAuth() {
        if (!getToken()) { window.location.href = '/auth'; return false; }
        return true;
    }
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
        const token = getToken();
        if (token) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = 'Bearer ' + token;
        }
        return originalFetch(url, options);
    };
    function logout() {
        localStorage.removeItem('token'); localStorage.removeItem('access_token'); localStorage.removeItem('authToken');
        window.location.href = '/auth';
    }

    // ═══════════════════════════════════════════
    // VARIABLES GLOBALES
    // ═══════════════════════════════════════════
    let horariosDisponibles = [];
    let horarioSeleccionado = null;
    let semanaActual = 1;
    let semanaMostrada = 1;
    let totalSemanas = 22;
    let asignaturasData = null;

    function abrirModalDetalle() { document.getElementById('modalDetalleOverlay').classList.add('active'); }
    function cerrarModalDetalle() { document.getElementById('modalDetalleOverlay').classList.remove('active'); }

    // ═══════════════════════════════════════════
    // PARTÍCULAS
    // ═══════════════════════════════════════════
    function createHeaderParticles() {
        const container = document.getElementById('headerParticles');
        if (!container) return;
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle-dot';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            p.style.opacity = Math.random() * 0.3 + 0.1;
            p.style.width = p.style.height = (Math.random() * 2 + 1) + 'px';
            container.appendChild(p);
        }
    }

    // ═══════════════════════════════════════════
    // INICIALIZACIÓN
    // ═══════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', async function() {
        if (!requireAuth()) return;
        createHeaderParticles();
        await cargarHorariosDisponibles();
        await cargarDatos();
    });

    // ═══════════════════════════════════════════
    // HORARIOS DISPONIBLES Y SELECTOR
    // ═══════════════════════════════════════════
    async function cargarHorariosDisponibles() {
        try {
            const res = await fetch('/api/horarios/horarios-disponibles');
            const data = await res.json();
            if (data.success) {
                horariosDisponibles = data.horarios_disponibles;
                actualizarSelector();
                if (horariosDisponibles.length > 0) {
                    const guardado = localStorage.getItem('horarioSeleccionado');
                    if (guardado) {
                        horarioSeleccionado = JSON.parse(guardado);
                        document.getElementById('selectorHorario').value = horarioSeleccionado.id;
                    } else {
                        const h = horariosDisponibles[0];
                        horarioSeleccionado = { id: h.id, año: h.año_carrera, semestre: h.semestre };
                        document.getElementById('selectorHorario').value = h.id;
                    }
                    localStorage.setItem('horarioSeleccionado', JSON.stringify(horarioSeleccionado));
                }
            }
        } catch(e) { console.error(e); }
    }

    function actualizarSelector() {
        const sel = document.getElementById('selectorHorario');
        sel.innerHTML = '<option value="">Seleccione un horario...</option>';
        horariosDisponibles.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h.id;
            opt.textContent = h.descripcion_completa || h.descripcion;
            sel.appendChild(opt);
        });
        if (horariosDisponibles.length === 1) sel.value = horariosDisponibles[0].id;
        sel.addEventListener('change', cambiarHorario);
    }

    function cambiarHorario() {
        const sel = document.getElementById('selectorHorario');
        const opt = sel.options[sel.selectedIndex];
        if (!opt || !opt.value) return;
        horarioSeleccionado = {
            id: parseInt(opt.value),
            año: parseInt(opt.dataset?.ano || opt.textContent.match(/Año (\d+)/)?.[1] || 0),
            semestre: parseInt(opt.dataset?.semestre || opt.textContent.match(/Sem (\d+)/)?.[1] || 0)
        };
        localStorage.setItem('horarioSeleccionado', JSON.stringify(horarioSeleccionado));
        document.getElementById('infoHorarioActual').textContent =
            `Año ${horarioSeleccionado.año} - Sem ${horarioSeleccionado.semestre}`;
        cargarDatos();
        mostrarNotificacion('success', `Horario: Año ${horarioSeleccionado.año} - Semestre ${horarioSeleccionado.semestre}`);
    }

    async function cargarDatos() {
        if (!horarioSeleccionado) return;
        await Promise.all([cargarCalendarioSemanal(semanaMostrada), cargarAsignaturas()]);
    }

    // ═══════════════════════════════════════════
    // CALENDARIO SEMANAL
    // ═══════════════════════════════════════════
    async function cargarCalendarioSemanal(semana) {
        const container = document.getElementById('calendarioSemanal');
        container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fas fa-spinner fa-pulse text-2xl mb-2"></i><p>Cargando semana ${semana}...</p></div>`;
        try {
            let url = `/api/horarios/semana/${semana}?ano=${horarioSeleccionado.año}&semestre=${horarioSeleccionado.semestre}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.success) {
                mostrarCalendarioSemanal(data, semana);
                if (data.semana_actual) {
                    semanaActual = data.semana_actual;
                    totalSemanas = data.total_semanas || 22;
                    document.getElementById('semanaMostrada').textContent = semana;
                }
            } else {
                container.innerHTML = `<div class="text-center py-10 text-slate-400"><i class="fas fa-calendar-times text-4xl mb-3"></i><p class="font-semibold">Sin clases esta semana</p><p class="text-sm">Semana ${semana}</p></div>`;
            }
        } catch(e) {
            container.innerHTML = `<div class="bg-red-50 text-red-800 rounded-xl p-4 text-sm">Error al cargar la semana ${semana}</div>`;
        }
    }

    function mostrarCalendarioSemanal(data, semana) {
        const container = document.getElementById('calendarioSemanal');
        if (!data.calendario || data.calendario.length === 0) {
            container.innerHTML = `<div class="text-center py-10 text-slate-400"><i class="fas fa-calendar-times text-4xl mb-3"></i><p class="font-semibold">Sin clases esta semana</p></div>`;
            return;
        }
        let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">';
        data.calendario.forEach(dia => {
            const hoyClass = dia.es_hoy ? 'ring-2 ring-emerald-400 bg-emerald-50/50' : '';
            html += `<div class="rounded-xl border border-slate-200 p-4 ${hoyClass}">
                <h3 class="font-bold text-slate-800 mb-1">${dia.dia}</h3>
                <p class="text-xs text-slate-400 mb-3">${dia.fecha} ${dia.es_hoy ? '<span class="ml-1 bg-emerald-100 text-emerald-700 rounded-full px-2 py-0.5 text-xs font-bold">HOY</span>' : ''}</p>`;
            if (dia.clases.length > 0) {
                dia.clases.forEach(clase => {
                    html += `<div onclick="mostrarDetalleClase(${JSON.stringify(clase).replace(/"/g, '&quot;')})" class="cursor-pointer rounded-lg border-l-4 p-3 mb-2 bg-white shadow-sm hover:shadow-md transition" style="border-left-color: ${clase.color || '#10b981'}">
                        <p class="text-xs font-mono text-slate-500">${clase.hora}</p>
                        <p class="font-bold text-slate-800 text-sm">${clase.asignatura}</p>
                        <p class="text-xs text-slate-500">${clase.profesor || ''}</p>
                        ${clase.es_examen ? '<span class="inline-block mt-1 bg-amber-100 text-amber-800 rounded-full px-2 py-0.5 text-xs font-bold">EXAMEN</span>' : ''}
                    </div>`;
                });
            } else {
                html += `<div class="text-center py-6 text-slate-300"><i class="fas fa-coffee text-2xl mb-1"></i><p class="text-xs">Sin clases</p></div>`;
            }
            html += '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
    }

    function cambiarSemana(delta) {
        if (!horarioSeleccionado) { mostrarNotificacion('warning', 'Selecciona un horario primero'); return; }
        const nueva = semanaMostrada + delta;
        if (nueva < 1 || nueva > totalSemanas) {
            mostrarNotificacion('warning', `El semestre tiene ${totalSemanas} semanas`);
            return;
        }
        semanaMostrada = nueva;
        document.getElementById('semanaMostrada').textContent = semanaMostrada;
        cargarCalendarioSemanal(semanaMostrada);
    }

    function irASemanaActual() {
        if (!horarioSeleccionado) { mostrarNotificacion('warning', 'Selecciona un horario primero'); return; }
        semanaMostrada = semanaActual;
        document.getElementById('semanaMostrada').textContent = semanaMostrada;
        cargarCalendarioSemanal(semanaMostrada);
    }

    // ═══════════════════════════════════════════
    // ASIGNATURAS
    // ═══════════════════════════════════════════
    async function cargarAsignaturas() {
        if (!horarioSeleccionado) return;
        try {
            const res = await fetch(`/api/horarios/mis-asignaturas?ano=${horarioSeleccionado.año}&semestre=${horarioSeleccionado.semestre}`);
            const data = await res.json();
            if (data.success) {
                asignaturasData = data;
                mostrarAsignaturasLista();
            } else {
                document.getElementById('listaAsignaturas').innerHTML = `<div class="text-center py-8 text-slate-400">No se pudieron cargar las asignaturas</div>`;
            }
        } catch(e) {
            document.getElementById('listaAsignaturas').innerHTML = `<div class="bg-red-50 text-red-800 rounded-xl p-4 text-sm">Error de conexión</div>`;
        }
    }

    function mostrarAsignaturasLista() {
        const container = document.getElementById('listaAsignaturas');
        const contador = document.getElementById('contadorAsignaturas');
        if (!asignaturasData?.asignaturas?.length) {
            container.innerHTML = `<div class="text-center py-10 text-slate-400"><i class="fas fa-book-open text-4xl mb-3"></i><p class="font-semibold">No hay asignaturas</p><p class="text-sm">No tienes asignaturas este semestre</p></div>`;
            contador.textContent = '0';
            return;
        }
        contador.textContent = `${asignaturasData.asignaturas.length} asig.`;
        let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
        asignaturasData.asignaturas.forEach(a => {
            html += `<div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm" style="border-left: 4px solid ${a.color || '#10b981'}">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-lg" style="color:${a.color || '#10b981'}">${a.codigo}</h3>
                    <span class="rounded-full px-2 py-0.5 text-xs font-bold ${a.tipo_evaluacion === 'EX' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">${a.tipo_evaluacion === 'EX' ? 'EXAMEN' : 'ORDINARIO'}</span>
                </div>
                <p class="font-semibold text-slate-800 mb-2">${a.nombre}</p>
                <div class="text-xs text-slate-500 space-y-1 mb-3">
                    <p><i class="fas fa-user-tie mr-1"></i>${a.profesor || 'Sin profesor'}</p>
                    <p><i class="fas fa-clock mr-1"></i>${a.horas_semanales || 0} h/sem · ${a.turnos_semanales || 0} turnos</p>
                </div>
                <button onclick="verHorarioAsignatura('${a.codigo}')" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                    <i class="fas fa-eye mr-1"></i> Ver horarios
                </button>
            </div>`;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    function verHorarioAsignatura(codigo) {
        if (!horarioSeleccionado) return;
        window.location.href = `/horarios/user/horario-semestral-completo?ano=${horarioSeleccionado.año}&semestre=${horarioSeleccionado.semestre}&buscar=${codigo}`;
    }

    // ═══════════════════════════════════════════
    // NAVEGACIÓN DE TABS
    // ═══════════════════════════════════════════
    function mostrarCalendario() {
        document.getElementById('panel-calendario').classList.remove('hidden');
        document.getElementById('panel-asignaturas').classList.add('hidden');
        document.getElementById('tab-calendario').classList.add('border-emerald-500', 'text-emerald-700');
        document.getElementById('tab-calendario').classList.remove('border-transparent', 'text-slate-500');
        document.getElementById('tab-asignaturas').classList.add('border-transparent', 'text-slate-500');
        document.getElementById('tab-asignaturas').classList.remove('border-emerald-500', 'text-emerald-700');
    }
    function mostrarAsignaturas() {
        document.getElementById('panel-calendario').classList.add('hidden');
        document.getElementById('panel-asignaturas').classList.remove('hidden');
        document.getElementById('tab-asignaturas').classList.add('border-emerald-500', 'text-emerald-700');
        document.getElementById('tab-asignaturas').classList.remove('border-transparent', 'text-slate-500');
        document.getElementById('tab-calendario').classList.add('border-transparent', 'text-slate-500');
        document.getElementById('tab-calendario').classList.remove('border-emerald-500', 'text-emerald-700');
        if (!asignaturasData) cargarAsignaturas();
    }

    // ═══════════════════════════════════════════
    // MODAL DETALLE
    // ═══════════════════════════════════════════
    function mostrarDetalleClase(clase) {
        document.getElementById('detalleClaseContenido').innerHTML = `
            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 rounded" style="background:${clase.color || '#10b981'}"></div>
                    <h3 class="font-bold text-slate-900">${clase.asignatura} - ${clase.nombre || ''}</h3>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div><span class="font-semibold">Horario:</span><br>${clase.hora}</div>
                    <div><span class="font-semibold">Profesor:</span><br>${clase.profesor || 'No asignado'}</div>
                </div>
                <div class="text-xs"><span class="font-semibold">Aula:</span> ${clase.aula || 'Por asignar'}</div>
                ${clase.es_examen ? '<div class="bg-amber-50 text-amber-800 rounded-lg p-2 text-xs">Sesión de examen</div>' : ''}
                <button onclick="agregarRecordatorio('${clase.asignatura}', '${clase.hora}')" class="w-full rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 transition">
                    <i class="far fa-bell mr-1"></i> Agregar recordatorio
                </button>
            </div>`;
        abrirModalDetalle();
    }

    function agregarRecordatorio(asig, hora) {
        mostrarNotificacion('info', `Recordatorio para ${asig} a las ${hora}`);
    }

    // ═══════════════════════════════════════════
    // NOTIFICACIONES
    // ═══════════════════════════════════════════
    function mostrarNotificacion(tipo, msg) {
        const colores = {
            success: 'bg-emerald-50 text-emerald-800 border-emerald-200',
            error: 'bg-red-50 text-red-800 border-red-200',
            warning: 'bg-amber-50 text-amber-800 border-amber-200',
            info: 'bg-blue-50 text-blue-800 border-blue-200'
        };
        const el = document.createElement('div');
        el.className = `fixed top-5 right-5 z-50 max-w-sm w-full rounded-xl border p-4 shadow-lg notificacion flex items-center gap-3 ${colores[tipo] || colores.info}`;
        el.innerHTML = `<span class="text-sm">${msg}</span><button class="ml-auto text-lg opacity-50 hover:opacity-100" onclick="this.parentElement.remove()">&times;</button>`;
        document.body.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
    }

    // Cerrar modal con Escape
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModalDetalle(); });
    document.getElementById('modalDetalleOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modalDetalleOverlay')) cerrarModalDetalle();
    });
</script>
</body>
</html>
