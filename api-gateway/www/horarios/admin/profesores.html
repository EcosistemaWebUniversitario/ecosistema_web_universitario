<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores – Sistema de Horarios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animación para filas de tabla */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Notificaciones */
        .notificacion {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* Overlay de modal */
        .modal-overlay {
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

<!-- Header con gradiente del ecosistema -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-900 text-white py-4 px-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-lg font-black text-white">
                U
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">
                    <i class="fas fa-chalkboard-teacher mr-2"></i>Gestión de Profesores
                </h1>
                <p class="text-xs text-emerald-200 font-medium">Administra el claustro de profesores</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="/horarios/admin/dashboard"
               class="inline-flex items-center rounded-xl bg-white/10 px-3 py-2 text-sm font-semibold text-white backdrop-blur hover:bg-white/20 transition">
                <i class="fas fa-arrow-left mr-1"></i> Dashboard
            </a>
            <button onclick="logout()"
                    class="inline-flex items-center rounded-xl border border-red-400/30 px-3 py-2 text-sm font-semibold text-red-300 hover:bg-red-500/20 transition">
                <i class="fas fa-sign-out-alt mr-1"></i> Salir
            </button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Barra de título y acción -->
    <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-5 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
            <h2 class="text-xl font-black text-slate-900">Profesores</h2>
            <p class="text-sm text-slate-500">Crea y gestiona los profesores del sistema</p>
        </div>
        <button onclick="mostrarModalNuevo()"
                class="inline-flex items-center rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 transition shadow-sm">
            <i class="fas fa-plus mr-1"></i> Nuevo Profesor
        </button>
    </div>

    <!-- Tabla de profesores -->
    <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Código</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Nombres</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Apellidos</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Categ. Académica</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Categ. Científica</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Email</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Teléfono</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Estado</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProfesores">
                    <!-- Loading -->
                    <tr id="loading-row">
                        <td colspan="9" class="text-center py-16">
                            <i class="fas fa-spinner fa-pulse text-3xl text-emerald-600 mb-3"></i>
                            <p class="text-slate-500">Cargando profesores...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal de profesor -->
<div id="modalProfesorOverlay" class="fixed inset-0 z-50 modal-overlay bg-black/40 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl m-4 overflow-hidden ring-1 ring-slate-200 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between p-5 border-b border-slate-100">
            <h2 id="modalTitulo" class="text-lg font-bold text-slate-900">Nuevo Profesor</h2>
            <button onclick="cerrarModalProfesor()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
        </div>
        <div class="overflow-y-auto p-5 space-y-4">
            <form id="formProfesor" class="space-y-4">
                <input type="hidden" id="profesorId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="codigo" class="block text-sm font-semibold text-slate-700 mb-1">Código *</label>
                        <input type="text" id="codigo" required placeholder="Ej: PRO001"
                               class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label for="nombres" class="block text-sm font-semibold text-slate-700 mb-1">Nombres *</label>
                        <input type="text" id="nombres" required placeholder="Ej: Juan Carlos"
                               class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="apellidos" class="block text-sm font-semibold text-slate-700 mb-1">Apellidos *</label>
                        <input type="text" id="apellidos" required placeholder="Ej: Pérez López"
                               class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label for="categoria_academica" class="block text-sm font-semibold text-slate-700 mb-1">Categoría Académica</label>
                        <select id="categoria_academica" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                            <option value="">Seleccione...</option>
                            <option value="Instructor">Instructor</option>
                            <option value="Asistente">Asistente</option>
                            <option value="Auxiliar">Auxiliar</option>
                            <option value="Titular">Titular</option>
                            <option value="Profesor Titular">Profesor Titular</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="categoria_cientifica" class="block text-sm font-semibold text-slate-700 mb-1">Categoría Científica</label>
                        <select id="categoria_cientifica" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                            <option value="">Seleccione...</option>
                            <option value="Máster">Máster</option>
                            <option value="Doctor">Doctor</option>
                            <option value="Doctor en Ciencias">Doctor en Ciencias</option>
                        </select>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="email" placeholder="profesor@universidad.edu"
                               class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="telefono" class="block text-sm font-semibold text-slate-700 mb-1">Teléfono</label>
                        <input type="text" id="telefono" placeholder="Ej: +53 12345678"
                               class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label for="activo" class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
                        <select id="activo" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="flex justify-end gap-3 p-5 bg-slate-50 border-t border-slate-200">
            <button onclick="cerrarModalProfesor()"
                    class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition">
                Cancelar
            </button>
            <button onclick="guardarProfesor()"
                    class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
                <i class="fas fa-save mr-1"></i> Guardar Profesor
            </button>
        </div>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════
    // AUTENTICACIÓN CENTRALIZADA (JWT Supabase)
    // ═══════════════════════════════════════════
    function getToken() {
        return localStorage.getItem('token') ??
               localStorage.getItem('access_token') ??
               localStorage.getItem('authToken');
    }

    function requireAuth() {
        if (!getToken()) {
            window.location.href = '/auth';
            return false;
        }
        return true;
    }

    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
        const token = getToken();
        if (token) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = 'Bearer ' + token;
        }
        return originalFetch(url, options);
    };

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('access_token');
        localStorage.removeItem('authToken');
        window.location.href = '/auth';
    }

    // ═══════════════════════════════════════════
    // LÓGICA DE GESTIÓN DE PROFESORES
    // ═══════════════════════════════════════════
    let profesores = [];

    function abrirModalProfesor() {
        document.getElementById('modalProfesorOverlay').classList.add('active');
    }
    function cerrarModalProfesor() {
        document.getElementById('modalProfesorOverlay').classList.remove('active');
        document.getElementById('formProfesor').reset();
    }

    async function cargarProfesores() {
        try {
            const response = await fetch('/api/horarios/profesores');
            if (response.ok) {
                profesores = await response.json();
                renderizarTabla();
            } else {
                mostrarError('Error al cargar los profesores');
            }
        } catch (error) {
            console.error('Error:', error);
            mostrarError('Error de conexión al servidor');
        }
    }

    function renderizarTabla() {
        const tbody = document.getElementById('tablaProfesores');
        const loadingRow = document.getElementById('loading-row');
        if (loadingRow) loadingRow.remove();

        if (profesores.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center py-16 text-slate-500">
                        <i class="fas fa-chalkboard-teacher text-5xl text-slate-300 mb-4"></i>
                        <h3 class="text-lg font-bold text-slate-700">No hay profesores registrados</h3>
                        <p class="text-sm mb-4">Comienza agregando tu primer profesor</p>
                        <button onclick="mostrarModalNuevo()"
                                class="inline-flex items-center rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
                            <i class="fas fa-plus mr-1"></i> Crear primer profesor
                        </button>
                    </td>
                </tr>`;
            return;
        }

        let html = '';
        profesores.forEach(profesor => {
            html += `
                <tr class="border-b border-slate-100 hover:bg-slate-50 fade-in">
                    <td class="p-4 font-bold text-emerald-700">${profesor.codigo}</td>
                    <td class="p-4 text-slate-700">${profesor.nombres}</td>
                    <td class="p-4 text-slate-700">${profesor.apellidos}</td>
                    <td class="p-4">
                        ${profesor.categoria_academica
                            ? `<span class="bg-slate-100 text-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium">${profesor.categoria_academica}</span>`
                            : '<span class="text-slate-400">-</span>'}
                    </td>
                    <td class="p-4">
                        ${profesor.categoria_cientifica
                            ? `<span class="bg-slate-100 text-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium">${profesor.categoria_cientifica}</span>`
                            : '<span class="text-slate-400">-</span>'}
                    </td>
                    <td class="p-4">
                        ${profesor.email
                            ? `<a href="mailto:${profesor.email}" class="text-emerald-600 hover:text-emerald-800">${profesor.email}</a>`
                            : '<span class="text-slate-400">-</span>'}
                    </td>
                    <td class="p-4 text-slate-600">${profesor.telefono || '<span class="text-slate-400">-</span>'}</td>
                    <td class="p-4">
                        ${profesor.activo
                            ? '<span class="bg-emerald-100 text-emerald-700 rounded-full px-3 py-1 text-xs font-semibold">Activo</span>'
                            : '<span class="bg-red-100 text-red-700 rounded-full px-3 py-1 text-xs font-semibold">Inactivo</span>'}
                    </td>
                    <td class="p-4">
                        <div class="flex gap-1">
                            <button onclick="editarProfesor(${profesor.id})"
                                    class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="eliminarProfesor(${profesor.id})"
                                    class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 transition">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
        });
        tbody.innerHTML = html;
    }

    function mostrarModalNuevo() {
        document.getElementById('modalTitulo').textContent = 'Nuevo Profesor';
        document.getElementById('formProfesor').reset();
        document.getElementById('profesorId').value = '';
        document.getElementById('activo').value = 'true';
        abrirModalProfesor();
    }

    async function editarProfesor(id) {
        try {
            const response = await fetch(`/api/horarios/profesores/${id}`);
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || `Error ${response.status}`);
            }
            const profesor = await response.json();
            document.getElementById('modalTitulo').textContent = 'Editar Profesor';
            document.getElementById('profesorId').value = profesor.id;
            document.getElementById('codigo').value = profesor.codigo || '';
            document.getElementById('nombres').value = profesor.nombres || '';
            document.getElementById('apellidos').value = profesor.apellidos || '';
            document.getElementById('categoria_academica').value = profesor.categoria_academica || '';
            document.getElementById('categoria_cientifica').value = profesor.categoria_cientifica || '';
            document.getElementById('email').value = profesor.email || '';
            document.getElementById('telefono').value = profesor.telefono || '';
            document.getElementById('activo').value = profesor.activo ? 'true' : 'false';
            abrirModalProfesor();
        } catch (error) {
            console.error('Error al cargar el profesor:', error);
            alert(`Error al cargar el profesor: ${error.message}`);
        }
    }

    async function guardarProfesor() {
        const id = document.getElementById('profesorId').value;
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/horarios/profesores/${id}` : '/api/horarios/profesores';
        const codigo = document.getElementById('codigo').value.trim();
        const nombres = document.getElementById('nombres').value.trim();
        const apellidos = document.getElementById('apellidos').value.trim();

        if (!codigo || !nombres || !apellidos) {
            alert('Error: Código, nombres y apellidos son campos obligatorios');
            return;
        }

        const data = {
            codigo, nombres, apellidos,
            categoria_academica: document.getElementById('categoria_academica').value,
            categoria_cientifica: document.getElementById('categoria_cientifica').value,
            email: document.getElementById('email').value.trim(),
            telefono: document.getElementById('telefono').value.trim(),
            activo: document.getElementById('activo').value === 'true'
        };

        try {
            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (response.ok) {
                cerrarModalProfesor();
                await cargarProfesores();
                mostrarNotificacion('success', result.message || 'Profesor guardado exitosamente');
            } else {
                alert(`Error: ${result.error || 'Error desconocido'}`);
            }
        } catch (error) {
            console.error('Error de conexión:', error);
            alert('Error de conexión al servidor');
        }
    }

    async function eliminarProfesor(id) {
        if (!confirm('¿Está seguro de eliminar este profesor?\nEsta acción no se puede deshacer.')) return;
        try {
            const response = await fetch(`/api/horarios/profesores/${id}`, { method: 'DELETE' });
            const result = await response.json();
            if (response.ok) {
                await cargarProfesores();
                mostrarNotificacion('success', 'Profesor eliminado exitosamente');
            } else {
                mostrarNotificacion('error', `Error: ${result.error || 'Error al eliminar'}`);
            }
        } catch (error) {
            console.error('Error:', error);
            mostrarNotificacion('error', 'Error de conexión al servidor');
        }
    }

    function mostrarNotificacion(tipo, mensaje) {
        const colores = {
            success: 'bg-emerald-50 text-emerald-800 border-emerald-200',
            error: 'bg-red-50 text-red-800 border-red-200'
        };
        const iconos = {
            success: 'fas fa-check-circle text-emerald-600',
            error: 'fas fa-exclamation-triangle text-red-500'
        };
        const alerta = document.createElement('div');
        alerta.className = `fixed top-5 right-5 z-50 max-w-sm w-full rounded-xl border p-4 shadow-lg notificacion flex items-center gap-3 ${colores[tipo] || colores.error}`;
        alerta.innerHTML = `
            <i class="${iconos[tipo]} text-2xl"></i>
            <div class="flex-1">
                <p class="font-semibold text-sm">${tipo === 'success' ? 'Éxito' : 'Error'}</p>
                <p class="text-xs">${mensaje}</p>
            </div>
            <button class="text-lg opacity-50 hover:opacity-100" onclick="this.parentElement.remove()">&times;</button>
        `;
        document.body.appendChild(alerta);
        setTimeout(() => { if (alerta.parentNode) alerta.remove(); }, 4000);
    }

    function mostrarError(mensaje) {
        const tbody = document.getElementById('tablaProfesores');
        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center py-10">
                    <div class="inline-flex items-center gap-3 bg-red-50 text-red-800 rounded-xl p-4">
                        <i class="fas fa-exclamation-triangle text-xl"></i>
                        <span>${mensaje}</span>
                    </div>
                </td>
            </tr>`;
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        cargarProfesores();
    });
</script>
</body>
</html>
