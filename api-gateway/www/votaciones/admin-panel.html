<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración – Votaciones</title>
  <!-- Fuentes e iconos (sin admin.css) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================
       ESTILOS UNIFICADOS – ECOSISTEMA UNIVERSITARIO
       ============================================ */
    :root {
      --color-bg: #0a0e17;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-secondary: #475569;
      --color-text-muted: #94a3b8;
      --color-accent: #10b981;
      --color-accent-hover: #059669;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-info: #3b82f6;
      --color-ring: #e2e8f0;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 2rem;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--color-bg) 0%, #1e293b 100%);
      color: var(--color-text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Header del módulo ── */
    .module-header {
      background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.95));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-2xl);
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow-lg);
    }

    .module-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .module-logo i {
      font-size: 2.5rem;
      color: var(--color-accent);
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
    }

    .module-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--color-accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .module-title p {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    /* ── Botones ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-xl);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: var(--color-danger);
      border: 1px solid rgba(239,68,68,0.3);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 0.5rem;
    }

    .btn-danger:hover {
      background: rgba(239,68,68,0.3);
      transform: translateY(-1px);
    }

    /* ── Tarjetas ── */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-ring);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 1rem;
    }

    /* ── Grid principal ── */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
    }

    /* ── Formularios ── */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      background: #fff;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    textarea.form-control {
      resize: vertical;
    }

    /* ── Buscador ── */
    .search-box { position: relative; }
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
      background: #fff; border: 1px solid #e2e8f0; border-top: none;
      border-radius: 0 0 0.75rem 0.75rem; max-height: 240px; overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .search-result-item {
      padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }
    .search-result-item:hover { background: #f8fafc; }
    .search-result-item .nombre { font-weight: 600; font-size: 0.95rem; color: #0f172a; }
    .search-result-item .detalle { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }
    .selected-student {
      background: #ecfdf5; border: 1px solid #a7f3d0;
      border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .selected-student .info .nombre { font-weight: 600; color: #0f172a; }
    .selected-student .info .ci { font-size: 0.8rem; color: #475569; }
    .btn-clear { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.2rem; padding: 0 0.2rem; }

    /* ── Lista de candidatos ── */
    .candidato-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 0; border-bottom: 1px solid #f1f5f9;
    }
    .candidato-item:last-child { border-bottom: none; }
    .candidato-info strong { color: #0f172a; }
    .candidato-tipo { font-size: 0.8rem; color: #64748b; margin-left: 0.5rem; }
    .candidato-desc { font-size: 0.85rem; color: #475569; margin-top: 0.2rem; }

    /* ── Estado del sistema ── */
    .estado-sistema p {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #334155;
    }
    .estado-sistema strong { color: #0f172a; }

    /* ── Mensajes ── */
    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      display: none;
    }
    .message.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
    .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .message.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Encabezado del módulo -->
    <div class="module-header">
      <div class="module-logo">
        <i class="fas fa-vote-yea"></i>
        <div class="module-title">
          <h1>Panel de Administración</h1>
          <p>Gestión de candidatos y configuración de votaciones</p>
        </div>
      </div>
      <div class="header-actions">
        <button onclick="API.logout()" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        <button onclick="window.location.href='resultados.html'" class="btn btn-primary"><i class="fas fa-chart-bar"></i> Ver Resultados</button>
      </div>
    </div>

    <div class="admin-grid">
      <!-- Columna izquierda: Gestión de Candidatos -->
      <div class="card">
        <h2>Gestión de Candidatos</h2>

        <h3>Agregar Candidato</h3>
        <div class="form-group">
          <label>Buscar Estudiante (nombre o CI):</label>
          <div class="search-box">
            <input type="text" id="searchInput" class="form-control" placeholder="Escribe al menos 2 caracteres..." autocomplete="off">
            <div id="searchResults" class="search-results" style="display:none;"></div>
          </div>
        </div>

        <div id="selectedStudentBox" style="display:none;" class="selected-student">
          <div class="info">
            <div class="nombre" id="selectedNombre"></div>
            <div class="ci" id="selectedCI"></div>
          </div>
          <button class="btn-clear" onclick="limpiarSeleccion()" title="Quitar selección">✕</button>
        </div>

        <div class="form-group">
          <label>Tipo de Candidatura:</label>
          <select id="tipoCandidato" class="form-control" required>
            <option value="">Seleccionar...</option>
            <option value="organizacion">Miembro de Organización</option>
            <option value="lider">Líder de Organización</option>
            <option value="ambos">Ambas Candidaturas</option>
          </select>
        </div>

        <div class="form-group">
          <label>Descripción (opcional):</label>
          <textarea id="descripcionCandidato" class="form-control" rows="3"></textarea>
        </div>

        <button id="btnAgregar" class="btn btn-primary" onclick="agregarCandidato()">Agregar Candidato</button>
        <div id="mensajeCandidato" class="message"></div>

        <h3 style="margin-top: 2rem;">Candidatos Registrados</h3>
        <div id="listaCandidatos" class="candidato-list">Cargando...</div>
      </div>

      <!-- Columna derecha: Configuración y Estado -->
      <div>
        <div class="card">
          <h2>Configuración del Sistema</h2>
          <h3>Tiempo de Votación</h3>
          <div class="form-group">
            <label>Fecha y Hora de Inicio:</label>
            <input type="datetime-local" id="inicioVotacion" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Fecha y Hora de Fin:</label>
            <input type="datetime-local" id="finVotacion" class="form-control" required>
          </div>
          <button class="btn btn-primary" onclick="guardarConfiguracion()">Establecer Tiempo</button>
          <div id="mensajeConfig" class="message"></div>
        </div>

        <div class="card">
          <h2>Estado del Sistema</h2>
          <div id="estadoSistema" class="estado-sistema">Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts (mantenidos exactamente igual) -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    let estudianteSeleccionado = null;
    let searchTimer = null;

    // ═══════════════════════════════════════════
    // AUTENTICACIÓN CENTRALIZADA (JWT Supabase)
    // ═══════════════════════════════════════════
    function getToken() {
      return localStorage.getItem('token') ??
             localStorage.getItem('access_token') ??
             localStorage.getItem('authToken');
    }

    async function verificarAcceso() {
      const token = getToken();
      if (!token) {
        window.location.href = '/auth/login';
        return false;
      }

      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) {
          window.location.href = '/auth/login';
          return false;
        }
        const data = await res.json();
        if (data.role !== 'admin_votaciones') {
          alert('Acceso denegado. Necesitas rol de administrador de votaciones.');
          window.location.href = '/votaciones/';
          return false;
        }
        return true;
      } catch (e) {
        console.error('Error verificando acceso:', e);
        window.location.href = '/auth/login';
        return false;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const permitido = await verificarAcceso();
      if (!permitido) return;

      await cargarTodo();
      iniciarBuscador();
    });

    // ── Buscador de estudiantes ──────────────────────────────────────────
    function iniciarBuscador() {
      const input = document.getElementById('searchInput');
      const resultsBox = document.getElementById('searchResults');

      input.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const q = input.value.trim();
        if (q.length < 2) { resultsBox.style.display = 'none'; return; }
        searchTimer = setTimeout(() => buscarEstudiantes(q), 300);
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !resultsBox.contains(e.target)) {
          resultsBox.style.display = 'none';
        }
      });
    }

    async function buscarEstudiantes(q) {
      const resultsBox = document.getElementById('searchResults');
      resultsBox.innerHTML = '<div style="padding:0.75rem 1rem; color:#94a3b8; font-size:0.9rem;">Buscando...</div>';
      resultsBox.style.display = 'block';

      try {
        // Usamos API._fetch que envía el token automáticamente
        const data = await API._fetch(`/api/votaciones/estudiantes/buscar?q=${encodeURIComponent(q)}`);
        if (!data.length) {
          resultsBox.innerHTML = '<div style="padding:0.75rem 1rem; color:#94a3b8; font-size:0.9rem;">No se encontraron estudiantes</div>';
          return;
        }

        resultsBox.innerHTML = data.map(est => `
          <div class="search-result-item" onclick="seleccionarEstudiante(${JSON.stringify(est).replace(/"/g, '&quot;')})">
            <div class="nombre">${est.nombre}</div>
            <div class="detalle">Rol: estudiante</div>
          </div>
        `).join('');
      } catch (e) {
        resultsBox.innerHTML = '<div style="padding:0.75rem 1rem; color:#ef4444; font-size:0.9rem;">Error al buscar</div>';
      }
    }

    function seleccionarEstudiante(est) {
      estudianteSeleccionado = est;
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').style.display = 'none';
      document.getElementById('selectedNombre').textContent = est.nombre;
      document.getElementById('selectedCI').textContent = `Rol: estudiante`;
      document.getElementById('selectedStudentBox').style.display = 'flex';
    }

    function limpiarSeleccion() {
      estudianteSeleccionado = null;
      document.getElementById('selectedStudentBox').style.display = 'none';
      document.getElementById('searchInput').value = '';
    }

    // ── Agregar candidato ────────────────────────────────────────────────
    async function agregarCandidato() {
      if (!estudianteSeleccionado) {
        mostrarMensaje('Debes buscar y seleccionar un estudiante', 'error', 'mensajeCandidato');
        return;
      }
      const tipo = document.getElementById('tipoCandidato').value;
      if (!tipo) {
        mostrarMensaje('Selecciona el tipo de candidatura', 'error', 'mensajeCandidato');
        return;
      }
      const desc = document.getElementById('descripcionCandidato').value.trim();

      const btn = document.getElementById('btnAgregar');
      btn.disabled = true;
      btn.textContent = 'Agregando...';

      const res = await API.agregarCandidato(estudianteSeleccionado.nombre, tipo, desc, estudianteSeleccionado.profile_id);

      btn.disabled = false;
      btn.textContent = 'Agregar Candidato';

      if (res.success) {
        mostrarMensaje('Candidato agregado correctamente', 'success', 'mensajeCandidato');
        limpiarSeleccion();
        document.getElementById('tipoCandidato').value = '';
        document.getElementById('descripcionCandidato').value = '';
        await cargarCandidatos();
      } else {
        mostrarMensaje(res.error || 'Error al agregar', 'error', 'mensajeCandidato');
      }
    }

    // ── Configuración ────────────────────────────────────────────────────
    async function guardarConfiguracion() {
      const inicio = new Date(document.getElementById('inicioVotacion').value).toISOString();
      const fin    = new Date(document.getElementById('finVotacion').value).toISOString();
      const res = await API.actualizarConfiguracion(inicio, fin);
      if (res.success) {
        mostrarMensaje('Tiempo de votación actualizado', 'success', 'mensajeConfig');
        await cargarEstado();
      } else {
        mostrarMensaje(res.error || 'Error al actualizar', 'error', 'mensajeConfig');
      }
    }

    // ── Carga de datos ───────────────────────────────────────────────────
    async function cargarTodo() {
      await Promise.all([cargarCandidatos(), cargarEstado(), cargarConfiguracion()]);
    }

    async function cargarCandidatos() {
      const candidatos = await API.getCandidatos();
      const lista = document.getElementById('listaCandidatos');
      if (!candidatos.length) { lista.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:1rem;">No hay candidatos registrados.</p>'; return; }
      lista.innerHTML = candidatos.map(c => `
        <div class="candidato-item">
          <div>
            <strong>${c.nombre}</strong><span class="candidato-tipo">[${c.tipo}]</span>
            ${c.descripcion ? `<div class="candidato-desc">${c.descripcion}</div>` : ''}
          </div>
          <button onclick="eliminarCandidato(${c.id})" class="btn btn-danger">Eliminar</button>
        </div>
      `).join('');
    }

    async function eliminarCandidato(id) {
      if (!confirm('¿Eliminar este candidato?')) return;
      const res = await API.eliminarCandidato(id);
      if (res.success) await cargarCandidatos();
      else alert('Error al eliminar: ' + (res.error || ''));
    }

    async function cargarEstado() {
      const stats = await API.estadisticasAdmin();
      document.getElementById('estadoSistema').innerHTML = `
        <p>Candidatos: <strong>${stats.total_candidatos}</strong></p>
        <p>Votos Organización: <strong>${stats.votos_organizacion}</strong></p>
        <p>Votos Líder: <strong>${stats.votos_lider}</strong></p>
        <p>Votación activa: <strong>${stats.votacion_activa ? '✅ Sí' : '❌ No'}</strong></p>
      `;
    }

    async function cargarConfiguracion() {
      const config = await API.getConfiguracion();
      if (config.inicio_votacion) {
        document.getElementById('inicioVotacion').value = config.inicio_votacion.slice(0, 16);
        document.getElementById('finVotacion').value = config.fin_votacion.slice(0, 16);
      }
    }

    function mostrarMensaje(texto, tipo, id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = texto;
      el.className = `message ${tipo}`;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
  </script>
</body>
</html>
