events {}

http {
    default_type application/octet-stream;

    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    server {
        listen 8080;
        server_name localhost;

        root C:/Universidad/ecosistema_web_universitario/api-gateway/www;
        index index.html;

        location = / {
            return 302 /auth/;
        }

        location /auth/ {
            try_files $uri $uri/ /auth/index.html;
        }

        location /practicas/ {
            try_files $uri $uri/ /practicas/index.html;
        }

	location /horarios/ {
   		 alias C:/Universidad/ecosistema_web_universitario/api-gateway/www/horarios/;
   		 index index.html;
  		  try_files $uri $uri/ $uri.html /horarios/index.html;
	}

	
	location /api/auth/municipalities {
   		proxy_pass http://127.0.0.1:4002/api/v1/municipalities;
   		proxy_http_version 1.1;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
	}

	location /api/auth/careers {
    		proxy_pass http://127.0.0.1:4002/api/v1/careers;
    		proxy_http_version 1.1;
   		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
	}
		
	location /api/v1/ {
    	proxy_pass http://127.0.0.1:4002/api/v1/;
    	proxy_http_version 1.1;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
	}
	

        location /api/auth/ {
            proxy_pass http://127.0.0.1:4001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/practicas/ {
            proxy_pass http://127.0.0.1:4002/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Authorization $http_authorization;
    	    proxy_pass_header Authorization;
        }
	location /api/horarios/ {
 	   proxy_pass http://127.0.0.1:4003;
 	   proxy_http_version 1.1;
 	   proxy_set_header Host $host;
 	   proxy_set_header X-Real-IP $remote_addr;
 	   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  	   proxy_set_header X-Forwarded-Proto $scheme;
	}
    }
}