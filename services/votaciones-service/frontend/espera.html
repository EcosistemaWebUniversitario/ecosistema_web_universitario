<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votación Registrada – Votaciones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================
       ESTILOS UNIFICADOS – ECOSISTEMA UNIVERSITARIO
       ============================================ */
    :root {
      --color-bg: #0a0e17;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-secondary: #475569;
      --color-text-muted: #94a3b8;
      --color-accent: #10b981;
      --color-accent-hover: #059669;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-info: #3b82f6;
      --color-ring: #e2e8f0;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 2rem;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--color-bg) 0%, #1e293b 100%);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .espera-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      padding: 3rem 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-ring);
    }

    .espera-icon {
      font-size: 80px;
      margin-bottom: 1.5rem;
    }

    .espera-container h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 1rem;
    }

    .espera-container p {
      color: var(--color-text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .tiempo-restante {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-accent);
      margin: 1.5rem 0;
      padding: 1rem 1.5rem;
      background: #ecfdf5;
      border-radius: var(--radius-xl);
      border: 1px solid #a7f3d0;
    }

    .espera-acciones {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Botones ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-xl);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-ring);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="espera-container">
    <div class="espera-icon">✅</div>
    <h1>¡Voto Registrado!</h1>
    <p>Has emitido tu voto correctamente. Los resultados estarán disponibles cuando finalice la votación.</p>
    <div class="tiempo-restante" id="tiempoRestante">Calculando tiempo restante...</div>
    <div class="espera-acciones">
      <button onclick="API.logout()" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
      <button onclick="window.location.href='resultados.html'" class="btn btn-primary"><i class="fas fa-chart-bar"></i> Ver Resultados</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // AUTENTICACIÓN CENTRALIZADA (JWT Supabase)
    // ═══════════════════════════════════════════
    function getToken() {
      return localStorage.getItem('token') ??
             localStorage.getItem('access_token') ??
             localStorage.getItem('authToken');
    }

    async function verificarAcceso() {
      const token = getToken();
      if (!token) {
        window.location.href = '/auth/login';
        return false;
      }

      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) {
          window.location.href = '/auth/login';
          return false;
        }
        const data = await res.json();
        if (data.role !== 'estudiante') {
          window.location.href = '/votaciones/';
          return false;
        }
        return true;
      } catch (e) {
        console.error('Error verificando acceso:', e);
        window.location.href = '/auth/login';
        return false;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const permitido = await verificarAcceso();
      if (!permitido) return;

      async function actualizar() {
        try {
          const estado = await API.estadoVotacion();
          if (estado.finalizada) {
            window.location.href = 'resultados.html';
            return;
          }
          document.getElementById('tiempoRestante').textContent = estado.tiempo_restante || 'Votación en curso';
        } catch (e) {
          console.error('Error al obtener estado:', e);
        }
      }

      await actualizar();
      setInterval(actualizar, 30000);
    });
  </script>
</body>
</html>
