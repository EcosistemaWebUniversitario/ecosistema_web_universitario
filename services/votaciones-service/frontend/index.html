<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Votación Estudiantil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================
       ESTILOS UNIFICADOS – ECOSISTEMA UNIVERSITARIO
       ============================================ */
    :root {
      --color-bg: #0a0e17;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-secondary: #475569;
      --color-text-muted: #94a3b8;
      --color-accent: #10b981;
      --color-accent-hover: #059669;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;
      --color-info: #3b82f6;
      --color-ring: #e2e8f0;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 2rem;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--color-bg) 0%, #1e293b 100%);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .login-box {
      background: var(--color-surface);
      padding: 3rem 2.5rem;
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid var(--color-ring);
    }

    .login-box h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }

    .login-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Botones ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      width: 100%;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      background: var(--color-accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-ring);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-link {
      background: none;
      color: var(--color-accent);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem;
    }

    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Sistema de Votación</h1>

      <div class="login-links">
      
        <a href="resultados.html" class="btn btn-link">Ver Resultados</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // AUTENTICACIÓN CENTRALIZADA (JWT Supabase)
    // ═══════════════════════════════════════════
    function getToken() {
      return localStorage.getItem('token') ??
             localStorage.getItem('access_token') ??
             localStorage.getItem('authToken');
    }

    async function getRole() {
      const token = getToken();
      if (!token) return null;
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          return data.role;
        }
      } catch (e) {
        console.warn('No se pudo obtener el rol desde /api/auth/me');
      }
      return null;
    }

    async function redirectIfAuthenticated() {
      const token = getToken();
      if (!token) return;

      const role = await getRole();
      if (role === 'admin_votaciones') {
        window.location.replace('/votaciones/admin-panel.html');
      } else if (role === 'estudiante') {
        window.location.replace('/votaciones/votacion.html');
      } else {
        // Si tiene sesión pero no es admin ni estudiante, lo llevamos a un panel genérico
        window.location.replace('/votaciones/votacion.html');
      }
    }

    // Redirigir automáticamente si ya hay sesión
    redirectIfAuthenticated();
  </script>
</body>
</html>
