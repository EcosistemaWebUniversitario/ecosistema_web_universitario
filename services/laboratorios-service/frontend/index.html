<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Laboratorios – Ecosistema Universitario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .page { display: none; }
    .page.active { display: block; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 50; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

<!-- Header del ecosistema -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-900 text-white py-4 px-4 shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-lg font-black text-white">U</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight"><i class="fas fa-flask mr-2"></i>Gestor de Laboratorios</h1>
        <p class="text-xs text-emerald-200 font-medium" id="headerSubtitle">Cargando...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="userEmail" class="text-xs text-slate-300 hidden sm:inline"></span>
      <button onclick="logout()" class="inline-flex items-center rounded-xl border border-red-400/30 px-3 py-2 text-sm font-semibold text-red-300 hover:bg-red-500/20 transition">
        <i class="fas fa-sign-out-alt mr-1"></i> Salir
      </button>
    </div>
  </div>
</header>

<!-- Navegación por tabs -->
<nav class="bg-white border-b border-slate-200 sticky top-[72px] z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 flex items-center gap-1 overflow-x-auto">
    <button onclick="showPage('dashboard')" id="tab-dashboard" class="px-4 py-3 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-700 whitespace-nowrap transition">
      <i class="fas fa-chart-pie mr-1"></i> Dashboard
    </button>
    <button onclick="showPage('labs')" id="tab-labs" class="px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition">
      <i class="fas fa-door-open mr-1"></i> Laboratorios
    </button>
    <button onclick="showPage('computers')" id="tab-computers" class="px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition">
      <i class="fas fa-desktop mr-1"></i> Computadoras
    </button>
    <button onclick="showPage('incidents')" id="tab-incidents" class="px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap transition">
      <i class="fas fa-exclamation-triangle mr-1"></i> Incidentes
    </button>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">

  <!-- ═══════════ DASHBOARD ═══════════ -->
  <div id="page-dashboard" class="page active">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
        <div id="statLabs" class="text-2xl font-black text-slate-900">-</div>
        <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Laboratorios</div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
        <div id="statComputers" class="text-2xl font-black text-slate-900">-</div>
        <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Computadoras</div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
        <div id="statIncidents" class="text-2xl font-black text-slate-900">-</div>
        <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Incidentes Abiertos</div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
        <div id="statMaint" class="text-2xl font-black text-slate-900">-</div>
        <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">En Mantenimiento</div>
      </div>
    </div>
   
  </div>

  <!-- ═══════════ LABORATORIOS ═══════════ -->
  <div id="page-labs" class="page">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-black text-slate-900">Laboratorios</h2>
      <button onclick="openLabForm()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
        <i class="fas fa-plus mr-1"></i> Nuevo
      </button>
    </div>
    <div id="labsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-slate-400 col-span-full text-center py-8">Cargando...</p>
    </div>
  </div>

  <!-- ═══════════ COMPUTADORAS ═══════════ -->
  <div id="page-computers" class="page">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-black text-slate-900">Computadoras</h2>
      <button onclick="openComputerForm()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
        <i class="fas fa-plus mr-1"></i> Nueva
      </button>
    </div>
    <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 mb-4">
      <label class="text-sm font-semibold text-slate-600 mr-2">Filtrar por Lab:</label>
      <select id="filterLab" onchange="loadComputers()" class="rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm">
        <option value="">Todos</option>
      </select>
    </div>
    <div id="computersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-slate-400 col-span-full text-center py-8">Cargando...</p>
    </div>
  </div>

  <!-- ═══════════ INCIDENTES ═══════════ -->
  <div id="page-incidents" class="page">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-black text-slate-900">Incidentes</h2>
      <button onclick="openIncidentForm()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
        <i class="fas fa-plus mr-1"></i> Reportar
      </button>
    </div>
    <div id="incidentsGrid" class="space-y-3">
      <p class="text-slate-400 text-center py-8">Cargando...</p>
    </div>
  </div>
</main>

<!-- ═══════════ MODALES ═══════════ -->
<!-- Modal Lab -->
<div id="modalLab" class="modal-overlay">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 p-5 ring-1 ring-slate-200">
    <h3 id="modalLabTitle" class="text-lg font-bold text-slate-900 mb-4">Nuevo Laboratorio</h3>
    <input type="hidden" id="labId">
    <div class="space-y-3">
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Nombre</label><input type="text" id="labName" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Ubicación</label><input type="text" id="labLocation" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Capacidad</label><input type="number" id="labCapacity" min="1" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
        <select id="labStatus" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm">
          <option value="ACTIVE">Activo</option><option value="INACTIVE">Inactivo</option><option value="MAINTENANCE">Mantenimiento</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-5">
      <button onclick="closeModal('modalLab')" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Cancelar</button>
      <button onclick="saveLab()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Computer -->
<div id="modalComputer" class="modal-overlay">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 p-5 ring-1 ring-slate-200">
    <h3 id="modalComputerTitle" class="text-lg font-bold text-slate-900 mb-4">Nueva Computadora</h3>
    <input type="hidden" id="computerId">
    <div class="space-y-3">
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Laboratorio</label><select id="computerLab" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></select></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">N° Serie</label><input type="text" id="computerSerial" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Marca</label><input type="text" id="computerBrand" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Modelo</label><input type="text" id="computerModel" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
        <select id="computerStatus" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm">
          <option value="AVAILABLE">Disponible</option><option value="IN_USE">En Uso</option><option value="BROKEN">Rota</option><option value="MAINTENANCE">Mantenimiento</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-5">
      <button onclick="closeModal('modalComputer')" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Cancelar</button>
      <button onclick="saveComputer()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Incident -->
<div id="modalIncident" class="modal-overlay">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 p-5 ring-1 ring-slate-200">
    <h3 id="modalIncidentTitle" class="text-lg font-bold text-slate-900 mb-4">Reportar Incidente</h3>
    <input type="hidden" id="incidentId">
    <div class="space-y-3">
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Computadora</label><select id="incidentComputer" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></select></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Título</label><input type="text" id="incidentTitle" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Descripción</label><textarea id="incidentDesc" rows="3" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm"></textarea></div>
      <div><label class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
        <select id="incidentStatus" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm">
          <option value="OPEN">Abierto</option><option value="IN_PROGRESS">En Progreso</option><option value="RESOLVED">Resuelto</option><option value="CLOSED">Cerrado</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-5">
      <button onclick="closeModal('modalIncident')" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Cancelar</button>
      <button onclick="saveIncident()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Guardar</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // ═══════════ INICIALIZACIÓN ═══════════
  if (!API.isLoggedIn()) window.location.href = '/auth';
  document.getElementById('userEmail').textContent = localStorage.getItem('user_email') || '';
  document.getElementById('headerSubtitle').textContent = 'Gestión de laboratorios, computadoras e incidentes';
  loadDashboard();

  // ═══════════ NAVEGACIÓN ═══════════
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('border-emerald-500', 'text-emerald-700'));
    document.getElementById('tab-' + name).classList.add('border-emerald-500', 'text-emerald-700');
    if (name === 'dashboard') loadDashboard();
    if (name === 'labs') loadLabs();
    if (name === 'computers') loadComputers();
    if (name === 'incidents') loadIncidents();
  }

  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function openModal(id) { document.getElementById(id).classList.add('active'); }

  function logout() { API.clearToken(); window.location.href = '/auth'; }

  // ═══════════ DASHBOARD ═══════════
  async function loadDashboard() {
    const [labs, computers, incidents] = await Promise.all([
      API.getLabs(),
      API.getComputers(),
      API.getIncidents()
    ]);

    const labsList = labs.data?.data || [];
    const compList = computers.data?.data || [];
    const incList = incidents.data?.data || [];

    document.getElementById('statLabs').textContent = labsList.length;
    document.getElementById('statComputers').textContent = compList.length;
    document.getElementById('statIncidents').textContent = incList.filter(i => i.status === 'OPEN').length;
    document.getElementById('statMaint').textContent = compList.filter(c => c.status === 'MAINTENANCE').length;
  }

  // ═══════════ LABORATORIOS ═══════════
  let labsCache = [];
  async function loadLabs() {
    const res = await API.getLabs();
    labsCache = res.data?.data || [];
    const grid = document.getElementById('labsGrid');
    if (!labsCache.length) {
      grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-8">No hay laboratorios</p>';
      return;
    }
    grid.innerHTML = labsCache.map(l => `
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition">
        <div class="flex justify-between items-start mb-2">
          <h3 class="font-bold text-slate-800">${l.name}</h3>
          <span class="rounded-full px-2 py-0.5 text-xs font-semibold ${l.status === 'ACTIVE' ? 'bg-emerald-100 text-emerald-700' : l.status === 'MAINTENANCE' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${l.status}</span>
        </div>
        <p class="text-sm text-slate-500"><i class="fas fa-map-marker-alt mr-1"></i>${l.location}</p>
        <p class="text-sm text-slate-500"><i class="fas fa-users mr-1"></i>Capacidad: ${l.capacity}</p>
        <div class="flex gap-1 mt-3">
          <button onclick="editLab('${l.id}')" class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50"><i class="fas fa-edit"></i></button>
          <button onclick="deleteLab('${l.id}')" class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button>
        </div>
      </div>`).join('');
  }

  function openLabForm() {
    // Limpia todos los campos por completo
    document.getElementById('labId').value = '';
    document.getElementById('labName').value = '';
    document.getElementById('labLocation').value = '';
    document.getElementById('labCapacity').value = '';
    document.getElementById('labStatus').value = 'ACTIVE';
    document.getElementById('modalLabTitle').textContent = 'Nuevo Laboratorio';
    openModal('modalLab');
  }

  function editLab(id) {
    const lab = labsCache.find(l => l.id === id);
    if (!lab) return;
    document.getElementById('labId').value = lab.id;
    document.getElementById('labName').value = lab.name;
    document.getElementById('labLocation').value = lab.location;
    document.getElementById('labCapacity').value = lab.capacity;
    document.getElementById('labStatus').value = lab.status;
    document.getElementById('modalLabTitle').textContent = 'Editar Laboratorio';
    openModal('modalLab');
  }

  async function saveLab() {
    const id = document.getElementById('labId').value;
    const body = {
      name: document.getElementById('labName').value.trim(),
      location: document.getElementById('labLocation').value.trim(),
      capacity: parseInt(document.getElementById('labCapacity').value) || 1,
      status: document.getElementById('labStatus').value
    };
    if (!body.name || !body.location) return alert('Completa nombre y ubicación');
    const res = id ? await API.updateLab(id, body) : await API.createLab(body);
    console.log('Respuesta del servidor:', res); // Verás el objeto completo
    if (res.ok) { closeModal('modalLab'); await loadLabs(); await loadDashboard(); }
    else alert('Error: ' + (res.message || 'No se pudo guardar'));
  }

  async function deleteLab(id) {
    if (!confirm('¿Eliminar este laboratorio?')) return;
    await API.deleteLab(id); await loadLabs(); await loadDashboard();
  }

  // ═══════════ COMPUTADORAS ═══════════
  let computersCache = [];
  async function loadComputers() {
    if (!labsCache.length) {
      const r = await API.getLabs();
      labsCache = r.data?.data || [];
    }
    document.getElementById('computerLab').innerHTML = labsCache.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
    document.getElementById('filterLab').innerHTML = '<option value="">Todos</option>' + labsCache.map(l => `<option value="${l.id}">${l.name}</option>`).join('');

    const filterVal = document.getElementById('filterLab').value;
    const res = filterVal ? await API.getComputersByLab(filterVal) : await API.getComputers();
    computersCache = res.data?.data || [];
    const grid = document.getElementById('computersGrid');
    if (!computersCache.length) {
      grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-8">No hay computadoras</p>';
      return;
    }
    grid.innerHTML = computersCache.map(c => `
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition">
        <div class="flex justify-between items-start mb-2">
          <h3 class="font-bold text-slate-800">${c.serial_number}</h3>
          <span class="rounded-full px-2 py-0.5 text-xs font-semibold ${
            c.status === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700' :
            c.status === 'IN_USE' ? 'bg-blue-100 text-blue-700' :
            c.status === 'BROKEN' ? 'bg-red-100 text-red-700' :
            'bg-amber-100 text-amber-700'
          }">${c.status}</span>
        </div>
        <p class="text-sm text-slate-500">${c.brand || ''} ${c.model || ''}</p>
        <p class="text-sm text-slate-500"><i class="fas fa-door-open mr-1"></i>${c.lab?.name || 'Sin lab'}</p>
        <div class="flex gap-1 mt-3">
          <button onclick="editComputer('${c.id}')" class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50"><i class="fas fa-edit"></i></button>
          <button onclick="deleteComputer('${c.id}')" class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button>
        </div>
      </div>`).join('');
  }

  async function ensureLabsLoaded() {
    if (!labsCache.length) {
      const r = await API.getLabs();
      labsCache = r.data?.data || [];
    }
    document.getElementById('computerLab').innerHTML = labsCache.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
    document.getElementById('filterLab').innerHTML = '<option value="">Todos</option>' + labsCache.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  }

  function openComputerForm() {
    ensureLabsLoaded().then(() => {
      document.getElementById('computerId').value = '';
      document.getElementById('computerSerial').value = '';
      document.getElementById('computerBrand').value = '';
      document.getElementById('computerModel').value = '';
      document.getElementById('computerStatus').value = 'AVAILABLE';
      document.getElementById('modalComputerTitle').textContent = 'Nueva Computadora';
      openModal('modalComputer');
    });
  }

  function editComputer(id) {
    ensureLabsLoaded().then(() => {
      const c = computersCache.find(x => x.id === id);
      if (!c) return;
      document.getElementById('computerId').value = c.id;
      document.getElementById('computerLab').value = c.lab_id;
      document.getElementById('computerSerial').value = c.serial_number;
      document.getElementById('computerBrand').value = c.brand || '';
      document.getElementById('computerModel').value = c.model || '';
      document.getElementById('computerStatus').value = c.status;
      document.getElementById('modalComputerTitle').textContent = 'Editar Computadora';
      openModal('modalComputer');
    });
  }

  async function saveComputer() {
    const id = document.getElementById('computerId').value;
    const body = {
      labId: document.getElementById('computerLab').value,
      serialNumber: document.getElementById('computerSerial').value.trim(),
      brand: document.getElementById('computerBrand').value.trim(),
      model: document.getElementById('computerModel').value.trim(),
      status: document.getElementById('computerStatus').value
    };
    if (!body.labId || !body.serialNumber) return alert('Selecciona un laboratorio y escribe el número de serie');
    const res = id ? await API.updateComputer(id, body) : await API.createComputer(body);
    console.log('Respuesta del servidor:', res);
    if (res.ok) { closeModal('modalComputer'); await loadComputers(); await loadDashboard(); }
    else alert('Error: ' + (res.message || 'No se pudo guardar'));
  }

  async function deleteComputer(id) {
    if (!confirm('¿Eliminar esta computadora?')) return;
    await API.deleteComputer(id); await loadComputers(); await loadDashboard();
  }

  // ═══════════ INCIDENTES ═══════════
  let incidentsCache = [];
  async function loadIncidents() {
    if (!computersCache.length) {
      const r = await API.getComputers();
      computersCache = r.data?.data || [];
    }
    document.getElementById('incidentComputer').innerHTML = computersCache.map(c => `<option value="${c.id}">${c.serial_number} — ${c.lab?.name || ''}</option>`).join('');

    const res = await API.getIncidents();
    incidentsCache = res.data?.data || [];
    const grid = document.getElementById('incidentsGrid');
    if (!incidentsCache.length) {
      grid.innerHTML = '<p class="text-slate-400 text-center py-8">No hay incidentes</p>';
      return;
    }
    grid.innerHTML = incidentsCache.map(i => `
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-bold text-slate-800">${i.title}</h3>
            <p class="text-xs text-slate-500">${i.computer?.serial_number || '-'} — ${i.computer?.lab?.name || ''}</p>
            <p class="text-sm text-slate-600 mt-1">${i.description?.slice(0, 100) || ''}</p>
          </div>
          <span class="rounded-full px-2 py-0.5 text-xs font-semibold ${
            i.status === 'OPEN' ? 'bg-red-100 text-red-700' :
            i.status === 'IN_PROGRESS' ? 'bg-amber-100 text-amber-700' :
            i.status === 'RESOLVED' ? 'bg-blue-100 text-blue-700' :
            'bg-slate-100 text-slate-600'
          }">${i.status}</span>
        </div>
        <div class="flex gap-1 mt-3">
          <button onclick="editIncident('${i.id}')" class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50"><i class="fas fa-edit"></i></button>
          <button onclick="deleteIncident('${i.id}')" class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50"><i class="fas fa-trash-alt"></i></button>
        </div>
      </div>`).join('');
  }

  async function ensureComputersLoaded() {
    if (!computersCache.length) {
      const r = await API.getComputers();
      computersCache = r.data?.data || [];
    }
    document.getElementById('incidentComputer').innerHTML = computersCache.map(c => `<option value="${c.id}">${c.serial_number} — ${c.lab?.name || ''}</option>`).join('');
  }

  function openIncidentForm() {
    ensureComputersLoaded().then(() => {
      document.getElementById('incidentId').value = '';
      document.getElementById('incidentTitle').value = '';
      document.getElementById('incidentDesc').value = '';
      document.getElementById('incidentStatus').value = 'OPEN';
      document.getElementById('modalIncidentTitle').textContent = 'Reportar Incidente';
      openModal('modalIncident');
    });
  }

  function editIncident(id) {
    ensureComputersLoaded().then(() => {
      const i = incidentsCache.find(x => x.id === id);
      if (!i) return;
      document.getElementById('incidentId').value = i.id;
      document.getElementById('incidentComputer').value = i.computer_id;
      document.getElementById('incidentTitle').value = i.title;
      document.getElementById('incidentDesc').value = i.description;
      document.getElementById('incidentStatus').value = i.status;
      document.getElementById('modalIncidentTitle').textContent = 'Editar Incidente';
      openModal('modalIncident');
    });
  }

  async function saveIncident() {
    const id = document.getElementById('incidentId').value;
    const body = {
      computerId: document.getElementById('incidentComputer').value,
      title: document.getElementById('incidentTitle').value.trim(),
      description: document.getElementById('incidentDesc').value.trim(),
      status: document.getElementById('incidentStatus').value
    };
    if (!body.computerId || !body.title) return alert('Selecciona una computadora y escribe un título');
    const res = id ? await API.updateIncident(id, body) : await API.createIncident(body);
    console.log('Respuesta del servidor:', res);
    if (res.ok) { closeModal('modalIncident'); await loadIncidents(); await loadDashboard(); }
    else alert('Error: ' + (res.message || 'No se pudo guardar'));
  }

  async function deleteIncident(id) {
    if (!confirm('¿Eliminar este incidente?')) return;
    await API.deleteIncident(id); await loadIncidents(); await loadDashboard();
  }
</script>
</body>
</html>
