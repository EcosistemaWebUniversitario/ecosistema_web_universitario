<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios – Sistema de Horarios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .notificacion { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal-overlay { display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

<!-- Header del ecosistema -->
<header class="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-900 text-white py-4 px-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-lg font-black text-white">U</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight"><i class="fas fa-users-cog mr-2"></i>Gestión de Usuarios</h1>
                <p class="text-xs text-emerald-200 font-medium">Administra los accesos al sistema</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="/horarios/admin/dashboard"
               class="inline-flex items-center rounded-xl bg-white/10 px-3 py-2 text-sm font-semibold text-white backdrop-blur hover:bg-white/20 transition">
                <i class="fas fa-arrow-left mr-1"></i> Dashboard
            </a>
            <button onclick="logout()"
                    class="inline-flex items-center rounded-xl border border-red-400/30 px-3 py-2 text-sm font-semibold text-red-300 hover:bg-red-500/20 transition">
                <i class="fas fa-sign-out-alt mr-1"></i> Salir
            </button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
            <div id="totalUsuarios" class="text-2xl font-black text-slate-900">-</div>
            <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Total</div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
            <div id="totalAdmins" class="text-2xl font-black text-slate-900">-</div>
            <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Admins</div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
            <div id="totalNormales" class="text-2xl font-black text-slate-900">-</div>
            <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Usuarios</div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-4 text-center">
            <div id="totalActivos" class="text-2xl font-black text-slate-900">-</div>
            <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 mt-1">Activos</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div class="relative w-full sm:w-72">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="busqueda" placeholder="Buscar usuario..." oninput="filtrarTabla()"
                   class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
        </div>
        <button onclick="abrirModalCrear()"
                class="inline-flex items-center rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 transition shadow-sm">
            <i class="fas fa-user-plus mr-1"></i> Nuevo Usuario
        </button>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Usuario</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Email</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Rol</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Estado</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Registro</th>
                        <th class="text-left p-4 font-semibold uppercase tracking-wider text-slate-500 text-xs">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyUsuarios">
                    <tr><td colspan="6" class="text-center py-10 text-slate-400"><i class="fas fa-spinner fa-pulse mr-2"></i>Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Usuario -->
<div id="modalUsuarioOverlay" class="fixed inset-0 z-50 modal-overlay bg-black/40 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md m-4 overflow-hidden ring-1 ring-slate-200">
        <div class="flex items-center justify-between p-5 border-b border-slate-100">
            <h2 id="modalTitulo" class="text-lg font-bold text-slate-900"><i class="fas fa-user-plus mr-2"></i>Nuevo Usuario</h2>
            <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
        </div>
        <div class="p-5 space-y-4">
            <div id="alertModal" class="hidden rounded-xl p-3 text-sm"></div>
            <input type="hidden" id="userId">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre de usuario *</label>
                <input type="text" id="uUsername" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" placeholder="ej: juan.perez">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email *</label>
                <input type="email" id="uEmail" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" placeholder="ej: juan@horarios.edu">
            </div>
            <div>
                <label id="lblPassword" class="block text-sm font-semibold text-slate-700 mb-1">Contraseña *</label>
                <input type="password" id="uPassword" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" placeholder="Mínimo 6 caracteres">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Rol</label>
                <select id="uRol" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    <option value="user">Usuario normal</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div id="grupoActivo" style="display:none;">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
                <select id="uActivo" class="w-full rounded-xl border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>
        </div>
        <div class="flex justify-end gap-3 p-5 bg-slate-50 border-t border-slate-200">
            <button onclick="cerrarModal()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition">Cancelar</button>
            <button onclick="guardarUsuario()" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
                <i class="fas fa-save mr-1"></i> Guardar
            </button>
        </div>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════
    // AUTENTICACIÓN
    // ═══════════════════════════════════════════
    function getToken() {
        return localStorage.getItem('token') ?? localStorage.getItem('access_token') ?? localStorage.getItem('authToken');
    }
    function requireAuth() {
        if (!getToken()) { window.location.href = '/auth'; return false; }
        return true;
    }
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
        const token = getToken();
        if (token) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = 'Bearer ' + token;
        }
        return originalFetch(url, options);
    };
    function logout() {
        localStorage.removeItem('token'); localStorage.removeItem('access_token'); localStorage.removeItem('authToken');
        window.location.href = '/auth';
    }

    // ═══════════════════════════════════════════
    // LÓGICA DE USUARIOS
    // ═══════════════════════════════════════════
    let usuarios = [];
    let modoEdicion = false;

    function abrirModal() { document.getElementById('modalUsuarioOverlay').classList.add('active'); }
    function cerrarModal() { document.getElementById('modalUsuarioOverlay').classList.remove('active'); }

    async function cargarUsuarios() {
        try {
            const res = await fetch('/api/horarios/usuarios');
            usuarios = await res.json();
            renderTabla(usuarios);
            actualizarStats();
        } catch(e) { mostrarMsgGlobal('Error al cargar usuarios', 'error'); }
    }

    function actualizarStats() {
        document.getElementById('totalUsuarios').textContent = usuarios.length;
        document.getElementById('totalAdmins').textContent = usuarios.filter(u => u.role === 'admin_horarios').length;
        document.getElementById('totalNormales').textContent = usuarios.filter(u => u.role === 'user').length;
        document.getElementById('totalActivos').textContent = usuarios.filter(u => u.activo).length;
    }

    function renderTabla(lista) {
        const tbody = document.getElementById('tbodyUsuarios');
        if (!lista.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-slate-400">No hay usuarios</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(u => `
            <tr class="border-b border-slate-100 hover:bg-slate-50 fade-in">
                <td class="p-4 font-bold text-slate-800"><i class="fas fa-user text-slate-300 mr-2"></i>${u.username}</td>
                <td class="p-4 text-slate-600">${u.email}</td>
                <td class="p-4">
                    <span class="rounded-full px-3 py-1 text-xs font-semibold ${u.role === 'admin_horarios' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                        ${u.role === 'admin_horarios' ? '⚙️ Admin' : '👤 Usuario'}
                    </span>
                </td>
                <td class="p-4">
                    <span class="rounded-full px-3 py-1 text-xs font-semibold ${u.activo ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                        ${u.activo ? 'Activo' : 'Inactivo'}
                    </span>
                </td>
                <td class="p-4 text-slate-500 text-xs">${u.fecha_registro || '-'}</td>
                <td class="p-4">
                    <div class="flex gap-1">
                        <button onclick="abrirModalEditar(${u.id})" class="rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"><i class="fas fa-edit"></i></button>
                        <button onclick="confirmarEliminar(${u.id}, '${u.username}')" class="rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 transition"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function filtrarTabla() {
        const q = document.getElementById('busqueda').value.toLowerCase();
        renderTabla(usuarios.filter(u => u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.role.toLowerCase().includes(q)));
    }

    function abrirModalCrear() {
        modoEdicion = false;
        document.getElementById('modalTitulo').innerHTML = '<i class="fas fa-user-plus mr-2"></i>Nuevo Usuario';
        document.getElementById('userId').value = '';
        document.getElementById('uUsername').value = '';
        document.getElementById('uEmail').value = '';
        document.getElementById('uPassword').value = '';
        document.getElementById('uRol').value = 'user';
        document.getElementById('lblPassword').textContent = 'Contraseña *';
        document.getElementById('grupoActivo').style.display = 'none';
        ocultarAlert();
        abrirModal();
    }

    function abrirModalEditar(id) {
        const u = usuarios.find(x => x.id === id); if (!u) return;
        modoEdicion = true;
        document.getElementById('modalTitulo').innerHTML = '<i class="fas fa-user-edit mr-2"></i>Editar Usuario';
        document.getElementById('userId').value = u.id;
        document.getElementById('uUsername').value = u.username;
        document.getElementById('uEmail').value = u.email;
        document.getElementById('uPassword').value = '';
        document.getElementById('uRol').value = u.role;
        document.getElementById('uActivo').value = u.activo ? 'true' : 'false';
        document.getElementById('lblPassword').textContent = 'Nueva contraseña (dejar vacío para no cambiar)';
        document.getElementById('grupoActivo').style.display = 'block';
        ocultarAlert();
        abrirModal();
    }

    async function guardarUsuario() {
        const id = document.getElementById('userId').value;
        const username = document.getElementById('uUsername').value.trim();
        const email = document.getElementById('uEmail').value.trim();
        const password = document.getElementById('uPassword').value;
        const role = document.getElementById('uRol').value;
        const activo = document.getElementById('uActivo').value === 'true';

        if (!username || !email) { mostrarAlert('Completa los campos requeridos', 'error'); return; }
        if (!modoEdicion && !password) { mostrarAlert('La contraseña es obligatoria', 'error'); return; }

        const body = { username, email, role };
        if (password) body.password = password;
        if (modoEdicion) body.activo = activo;

        try {
            const url = modoEdicion ? `/api/horarios/usuarios/${id}` : '/api/horarios/usuarios';
            const method = modoEdicion ? 'PUT' : 'POST';
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (data.success) {
                cerrarModal();
                mostrarMsgGlobal(data.message, 'success');
                await cargarUsuarios();
            } else {
                mostrarAlert(data.error || 'Error al guardar', 'error');
            }
        } catch(e) { mostrarAlert('Error de conexión', 'error'); }
    }

    async function confirmarEliminar(id, username) {
        if (!confirm(`¿Eliminar al usuario "${username}"? Esta acción no se puede deshacer.`)) return;
        try {
            const res = await fetch(`/api/horarios/usuarios/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                mostrarMsgGlobal(data.message, 'success');
                await cargarUsuarios();
            } else {
                mostrarMsgGlobal(data.error || 'No se pudo eliminar', 'error');
            }
        } catch(e) { mostrarMsgGlobal('Error de conexión', 'error'); }
    }

    function mostrarAlert(msg, tipo) {
        const el = document.getElementById('alertModal');
        el.className = `rounded-xl p-3 text-sm ${tipo === 'error' ? 'bg-red-50 text-red-800' : 'bg-emerald-50 text-emerald-800'}`;
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function ocultarAlert() { document.getElementById('alertModal').classList.add('hidden'); }

    function mostrarMsgGlobal(msg, tipo) {
        const el = document.createElement('div');
        el.className = `fixed top-5 right-5 z-50 max-w-sm w-full rounded-xl border p-4 shadow-lg notificacion flex items-center gap-3 ${
            tipo === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-800 border-red-200'
        }`;
        el.innerHTML = `<i class="fas ${tipo === 'success' ? 'fa-check-circle text-emerald-600' : 'fa-exclamation-triangle text-red-500'} text-2xl"></i>
                         <div class="flex-1"><p class="font-semibold text-sm">${tipo === 'success' ? 'Éxito' : 'Error'}</p><p class="text-xs">${msg}</p></div>
                         <button class="text-lg opacity-50 hover:opacity-100" onclick="this.parentElement.remove()">&times;</button>`;
        document.body.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', function() {
        if (!requireAuth()) return;
        cargarUsuarios();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
    document.getElementById('modalUsuarioOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modalUsuarioOverlay')) cerrarModal();
    });
</script>
</body>
</html>
