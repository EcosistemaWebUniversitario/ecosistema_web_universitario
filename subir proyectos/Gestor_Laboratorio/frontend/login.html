<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Gestor de Laboratorios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>🧪 Gestor de Laboratorios</h1>
      <p>Sistema de gestión de laboratorios universitarios</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña:</label>
          <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn-primary" style="width:100%">Ingresar</button>
      </form>
      <div id="msgLogin" class="message"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Si ya tiene token, ir al dashboard
    if (localStorage.getItem('labs_token')) window.location.href = '/index.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Verificando...';

      const data = await API.login(email, password);
      if (data.access_token) {
        setToken(data.access_token);
        localStorage.setItem('labs_user', data.user?.email || email);
        window.location.href = '/index.html';
      } else {
        mostrarMsg('msgLogin', data.error_description || 'Credenciales incorrectas', 'error');
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
