<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Sistema de Votación</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Panel de Administración</h1>
      <h2>Login de Administrador</h2>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUser">Email:</label>
          <input type="email" id="adminUser" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Contraseña:</label>
          <input type="password" id="adminPassword" required>
        </div>
        <button type="submit" class="btn-primary">Ingresar como Admin</button>
      </form>
      <div class="login-links">
        <a href="index.html" class="btn-secondary">Volver a Login Estudiantes</a>
      </div>
      <div id="adminMessage" class="message"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const sesion = await API.sesion();
      if (sesion.autenticado && sesion.role === 'admin_votaciones') {
        window.location.href = '/admin-panel.html';
        return;
      }

      document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('adminUser').value.trim();
        const password = document.getElementById('adminPassword').value;
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'Verificando...';
        const data = await API.loginAdmin(email, password);
        if (data.success) {
          window.location.href = data.redirect || '/admin-panel.html';
        } else {
          mostrarMensaje(data.message || 'Credenciales incorrectas', 'error', 'adminMessage');
          btn.disabled = false; btn.textContent = 'Ingresar como Admin';
        }
      });
    });
  </script>
</body>
</html>
