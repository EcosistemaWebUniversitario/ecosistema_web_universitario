<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Votación Estudiantil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Sistema de Votación</h1>

      <div class="tabs">
        <button class="tab-button active" data-tab="login" onclick="cambiarTab('login')">Iniciar Sesión</button>
        <button class="tab-button" data-tab="register" onclick="cambiarTab('register')">Crear Cuenta</button>
      </div>

      <!-- Login -->
      <form id="loginForm" class="tab-content active">
        <h2>Login de Estudiante</h2>
        <div class="form-group">
          <label for="matricula">Email:</label>
          <input type="email" id="matricula" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <div id="message" class="message"></div>
      </form>

      <!-- Registro -->
      <form id="registerForm" class="tab-content">
        <h2>Registro de Estudiante</h2>
        <div class="form-group">
          <label for="regNombre">Nombre Completo:</label>
          <input type="text" id="regNombre" placeholder="Nombre Apellidos" required>
        </div>
        <div class="form-group">
          <label for="regEmail">Email:</label>
          <input type="email" id="regEmail" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="regPassword">Contraseña:</label>
          <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirmar Contraseña:</label>
          <input type="password" id="regConfirm" placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
        <div id="registerMessage" class="message"></div>
      </form>

      <div class="login-links">
        <a href="admin-login.html" class="btn-secondary">Acceso Administrador</a>
        <a href="resultados.html" class="btn-link">Ver Resultados</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Si ya tiene sesión, redirigir
      const sesion = await API.sesion();
      if (sesion.autenticado) {
        window.location.href = sesion.role === 'admin_votaciones' ? '/admin-panel.html' : '/votacion.html';
        return;
      }

      // Login
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('matricula').value.trim();
        const password = document.getElementById('password').value;
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'Verificando...';
        const data = await API.login(email, password);
        if (data.success) {
          window.location.href = data.redirect || '/votacion.html';
        } else {
          mostrarMensaje(data.message || 'Credenciales incorrectas', 'error');
          btn.disabled = false; btn.textContent = 'Ingresar';
        }
      });

      // Registro
      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre   = document.getElementById('regNombre').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm  = document.getElementById('regConfirm').value;
        if (password !== confirm) { mostrarMensaje('Las contraseñas no coinciden', 'error', 'registerMessage'); return; }
        if (password.length < 6)  { mostrarMensaje('Mínimo 6 caracteres', 'error', 'registerMessage'); return; }
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'Creando cuenta...';
        const data = await API.registro(email, password, nombre);
        if (data.success) {
          mostrarMensaje('Cuenta creada. Ahora inicia sesión.', 'success', 'registerMessage');
          setTimeout(() => cambiarTab('login'), 2000);
        } else {
          mostrarMensaje(data.error || 'Error al crear cuenta', 'error', 'registerMessage');
        }
        btn.disabled = false; btn.textContent = 'Crear Cuenta';
      });
    });
  </script>
</body>
</html>
